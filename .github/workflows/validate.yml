name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-python step: these are stdlib-only and ubuntu-latest ships python3.
      - name: Test the validator
        run: python3 scripts/test_validate_structure.py
      - name: Validate plugin structure
        run: python3 scripts/validate_structure.py
      # The hone suites are unittest-based (stdlib-only, no pytest dependency),
      # so they run through unittest discover rather than a second runner.
      - name: Run hone script tests
        run: python3 -m unittest discover -s plugins/hone/skills/hone/scripts -p 'test_*.py'
      - name: Test hone outcome verifier controls
        run: python3 -m unittest discover -s plugins/hone/skills/hone/evals/evaluator -p 'test_*.py'
